<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <title>GamingHub - Registro</title>
  <link rel="stylesheet" href="style12.css">

</head>

<body>

  <div class="card">
    <h2>GamingHub</h2>

    <form id="form-register">
      <div class="grupo-campo">

        <label for="reg-usuario">Nuevo Usuario</label>
        <input type="text" id="reg-usuario" placeholder="Elegí un usuario" required>

      </div>

      <div class="grupo-campo">

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>

      </div>

      <div class="grupo-campo">

        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>

      </div>
       
      <button type="submit" class="btn">Crear Cuenta</button>

      
      <p class="switch-link">
        ¿Ya tenés cuenta? <a href="index.html">Iniciá sesión</a>
      </p>
    </form>

  </div>

</body>
</html>
